modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/saltydog16411/transformed-littlemaid-gun-bridge/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/saltydog16411/transformed-littlemaid-gun-bridge"
authors="${mod_authors}"
credits="Unofficial compatibility add-on for the LittleMaid and HMG2/GVCLib ecosystems. See THIRD_PARTY_NOTICES.txt."
displayTest="IGNORE_ALL_VERSION"
description='''
Client-side compatibility bridge for Transform Into LittleMaid and HandmadeGuns2/GVCLib.
It renders HMG2/GVCLib guns on transformed LittleMaid players in third person and replaces
the first-person Steve/Alex gun arms with the selected maid model's arms.

This is an unofficial project and does not redistribute third-party mods or assets.
'''

